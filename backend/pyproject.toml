[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "istiklal-backend"
version = "0.1.0"
description = "ISTIKLAL command center backend safety core"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "filterpy>=1.4.5,<2",
  "lap>=0.5.12,<1",
  "numpy>=1.26.0",
  "norfair==2.3.0",
  "opencv-python>=4.9.0,<4.12",
  "opencv-python-headless>=4.9.0,<4.12",
  "psutil>=5.9.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "pyserial>=3.5",
  "torch==2.12.0",
  "torchvision==0.27.0",
  "uvicorn[standard]>=0.30.0",
  "ultralytics>=8.4.51",
  "pygrabber>=0.2; sys_platform == 'win32'",
  "comtypes>=1.4.10; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
